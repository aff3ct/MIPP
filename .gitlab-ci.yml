# RVV build template: C++ only compilers (g++/clang++)
.build-common-rvv:
  extends: .matrix-linux-rvv
  image: registry.gitlab.com/aff3ct/aff3ct/mipp_${OS}:${COMPILER}_${ARCH}
  stage: build
  tags:
    - $OS
    - $ARCH
    - docker
  rules:
    - if: '$ARCH == "riscv64-rvv1.0"'
      variables:
        SIMD_EXT: "-march=rv64gv1_zve32f_zvl256b -mrvv-vector-bits=zvl"
        #SIMD_EXT: "-march=rv64gcv1_zve32f_zvl256b -mabi=lp64d -mrvv-vector-bits=256"
  before_script:
  - |
    if [ -z "$THREADS" ]; then
      if command -v nproc >/dev/null 2>&1; then
        THREADS=$(nproc)
      elif [ -f /proc/cpuinfo ]; then
        THREADS=$(grep -c ^processor /proc/cpuinfo)
      else
        THREADS=1
      fi
      export THREADS
    fi
  # define the real compiler executable name (because we compile in C++ and not in C)
  - |
    case "$COMPILER" in
      gcc-14)
        export COMPILER_CPP="g++-14"
        export COMPILER="g++-14"
        ;;
      clang-20)
        export COMPILER_CPP="clang++-20"
        export COMPILER="clang++-20"
        ;;
      *)
        echo "Unknown value of COMPILER: $COMPILER"
        exit 1
        ;;
    esac

