#         ARCH: [sse2, sse3, ssse3, sse4.1, sse4.2, avx, avx2, avx2-fma, avx512f, avx512bw, avx512dq]

.matrix-linux-rvv:
  parallel:
    matrix:
      - OS: [linux]
        # Only use C++ compilers for RVV (no C compiler usage in RVV jobs)
        COMPILER: ["gcc-14", "clang-20"]
        ARCH: [riscv64-rvv1.0]

# GENERATION ----------------------------------------------------------------------------------------------------------

generation-headers:
  image: registry.gitlab.com/aff3ct/aff3ct/mipp_linux:latest
  stage: generation
  allow_failure: false
  rules:
    - when: always
  artifacts:
    name: mipp_headers
    when: always
    paths:
      - include/
  tags:
    - x86_64
    - linux
    - docker
  script:
    - cd generator
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip3 install -r requirements.txt
    - ./gen_mipp_headers.py

generation-tests:
  image: registry.gitlab.com/aff3ct/aff3ct/mipp_linux:latest
  stage: generation
  allow_failure: false
  rules:
    - when: always
  artifacts:
    name: mipp_tests
    when: always
    paths:
      - tests/src/c_tests
      - tests/src/cpp_tests
      - tests/src/obj_tests
  tags:
    - x86_64
    - linux
    - docker
  script:
    - cd generator
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip3 install -r requirements.txt
    - ./gen_mipp_tests.py

# ANALYSIS ------------------------------------------------------------------------------------------------------------

analysis-cppcheck:
  image: registry.gitlab.com/aff3ct/aff3ct/mipp_linux:latest
  stage: analysis
  needs:
    - job: generation-headers
      artifacts: true
  allow_failure: false
  rules:
    - when: always
  artifacts:
    name: analysis-cppcheck-logs
    when: always
    paths:
      - cppcheck/
  tags:
    - x86_64
    - linux
    - docker
  script:
    - ./ci/analysis-cppcheck.sh

