variables:
  GIT_SUBMODULE_STRATEGY: none

stages:
  - generation
  - analysis
  - build
  # - test
  # - coverage
  # - deploy

before_script:
  - hostname
  - whoami
# - pwd

# GENERATION ----------------------------------------------------------------------------------------------------------

generation-headers:
  image: registry.gitlab.com/aff3ct/aff3ct/x86_64_ubuntu_mipp:latest
  stage: generation
  allow_failure: false
  artifacts:
    name: mipp_headers
    when: always
    paths:
      - include/
  tags:
    - x86_64
    - linux
    - docker
  script:
    - cd generator
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip3 install -r requirements.txt
    - ./gen_mipp.py

# ANALYSIS ------------------------------------------------------------------------------------------------------------

analysis-cppcheck:
  image: registry.gitlab.com/aff3ct/aff3ct/x86_64_ubuntu_cppcheck:v1.9
  stage: analysis
  needs:
    - job: generation-headers
      artifacts: true
  allow_failure: false
  artifacts:
    name: analysis-cppcheck-logs
    when: always
    paths:
      - cppcheck/
  tags:
    - x86_64
    - linux
    - docker
  script:
    - ./ci/analysis-cppcheck.sh

# BUILDS --------------------------------------------------------------------------------------------------------------

build-linux:
  image: registry.gitlab.com/aff3ct/aff3ct/x86_64_ubuntu_mipp:latest
  stage: build
  needs:
    - job: generation-headers
      artifacts: true
  allow_failure: false
  parallel:
    matrix:
      - OS: [linux]
        ARCH: [sse2, sse3, ssse3, sse4.1, sse4.2, avx, avx2, avx2-fma, avx512f, avx512bw]
        COMPILER: ["g++-14", "clang-20"]
  tags:
    - $OS
    - $ARCH
    - docker
  artifacts:
    name: build-$OS-$SIMD-$COMPILER
    when: always
    paths:
      - ./tests/build_$OS_$SIMD_$COMPILER/bin/
  rules:
    - if: '$ARCH == "sse2"'
      variables:
        SIMD_EXT: "-msse2"
    - if: '$ARCH == "sse3"'
      variables:
        SIMD_EXT: "-msse3"
    - if: '$ARCH == "ssse3"'
      variables:
        SIMD_EXT: "-mssse3"
    - if: '$ARCH == "sse4.1"'
      variables:
        SIMD_EXT: "-msse4.1"
    - if: '$ARCH == "sse4.2"'
      variables:
        SIMD_EXT: "-msse4.2"
    - if: '$ARCH == "avx"'
      variables:
        SIMD_EXT: "-mavx"
    - if: '$ARCH == "avx2"'
      variables:
        SIMD_EXT: "-mavx2"
    - if: '$ARCH == "avx2-fma"'
      variables:
        SIMD_EXT: "-mavx2 -mfma"
    - if: '$ARCH == "avx512f"'
      variables:
        SIMD_EXT: "-mavx512f"
    - if: '$ARCH == "avx512bw"'
      variables:
        SIMD_EXT: "-mavx512f -mavx512bw"
  script:
    - echo "Debug Job=$CI_NODE_INDEX/$CI_NODE_TOTAL"
    - echo "Debug OS=$OS"
    - echo "Debug ARCH=$ARCH"
    - echo "Debug COMPILER=$COMPILER"
    - echo "Debug SIMD_EXT=$SIMD_EXT"
    - source ./ci/tools/threads.sh
    - echo "Debug THREADS=$THREADS"
    - cd tests
    - cmake -S . -B build_$OS_$SIMD_$COMPILER -DCMAKE_CXX_COMPILER=$COMPILER -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wall -funroll-loops -finline-functions $SIMD_EXT" -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++"
    - cmake --build build_$OS_$SIMD_$COMPILER -j $THREADS

