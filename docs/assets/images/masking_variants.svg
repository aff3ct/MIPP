<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 482" width="680" height="482" role="img" aria-labelledby="mv-title mv-desc">
  <title id="mv-title">MIPP masking variants</title>
  <desc id="mv-desc">Result of a binary operation f(a, b) on four lanes with mask 1 0 1 0, for each variant. Active lanes (0 and 2) hold f(a, b) in every variant. Inactive lanes (1 and 3) hold f(a, b) when unmasked, the lane of a when merge-masked, zero when zero-masked, and the lane of src when source-masked.</desc>
  <defs>
    <style>
      .lbl  { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #64748b; }
      .sub  { font: 500 11px ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace; fill: #64748b; }
      .head { font: 600 11px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #64748b; letter-spacing: .06em; }
      .cell { font: 600 13px ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .zero-t { font: 600 13px ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace; fill: #64748b; text-anchor: middle; dominant-baseline: central; }
      .lane { font: 500 11px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #64748b; text-anchor: middle; }
      .leg  { font: 500 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #64748b; dominant-baseline: central; }
      .f    { fill: #059669; }
      .a    { fill: #7c3aed; }
      .b    { fill: #2563eb; }
      .s    { fill: #d97706; }
      .z    { fill: rgba(100, 116, 139, 0.14); stroke: #64748b; stroke-width: 1.5; }
      .on   { fill: #334155; stroke: #94a3b8; stroke-width: 1.5; }
      .off  { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .band { fill: rgba(100, 116, 139, 0.10); stroke: #64748b; stroke-width: 1; stroke-dasharray: 5 4; }
      .rule { stroke: #64748b; stroke-opacity: .45; stroke-width: 1; }
    </style>
  </defs>

  <!-- Inactive lanes (mask = 0): lanes 1 and 3 -->
  <rect class="band" x="321" y="238" width="106" height="176" rx="10"/>
  <rect class="band" x="533" y="238" width="106" height="176" rx="10"/>

  <!-- Lane indices -->
  <text class="lane" x="268" y="24">lane 0</text>
  <text class="lane" x="374" y="24">lane 1</text>
  <text class="lane" x="480" y="24">lane 2</text>
  <text class="lane" x="586" y="24">lane 3</text>

  <!-- ===== Operands ===== -->
  <text class="head" x="16" y="24">OPERANDS</text>

  <text class="lbl" x="16" y="56">a</text>
  <text class="sub" x="34" y="56">first operand</text>
  <rect class="a" x="220" y="36" width="96" height="34" rx="7"/><text class="cell" x="268" y="53">a₀</text>
  <rect class="a" x="326" y="36" width="96" height="34" rx="7"/><text class="cell" x="374" y="53">a₁</text>
  <rect class="a" x="432" y="36" width="96" height="34" rx="7"/><text class="cell" x="480" y="53">a₂</text>
  <rect class="a" x="538" y="36" width="96" height="34" rx="7"/><text class="cell" x="586" y="53">a₃</text>

  <text class="lbl" x="16" y="98">b</text>
  <text class="sub" x="34" y="98">second operand</text>
  <rect class="b" x="220" y="78" width="96" height="34" rx="7"/><text class="cell" x="268" y="95">b₀</text>
  <rect class="b" x="326" y="78" width="96" height="34" rx="7"/><text class="cell" x="374" y="95">b₁</text>
  <rect class="b" x="432" y="78" width="96" height="34" rx="7"/><text class="cell" x="480" y="95">b₂</text>
  <rect class="b" x="538" y="78" width="96" height="34" rx="7"/><text class="cell" x="586" y="95">b₃</text>

  <text class="lbl" x="16" y="140">src</text>
  <text class="sub" x="48" y="140">S variant only</text>
  <rect class="s" x="220" y="120" width="96" height="34" rx="7"/><text class="cell" x="268" y="137">src₀</text>
  <rect class="s" x="326" y="120" width="96" height="34" rx="7"/><text class="cell" x="374" y="137">src₁</text>
  <rect class="s" x="432" y="120" width="96" height="34" rx="7"/><text class="cell" x="480" y="137">src₂</text>
  <rect class="s" x="538" y="120" width="96" height="34" rx="7"/><text class="cell" x="586" y="137">src₃</text>

  <text class="lbl" x="16" y="182">m</text>
  <text class="sub" x="34" y="182">mask</text>
  <rect class="on"  x="220" y="162" width="96" height="34" rx="7"/><text class="cell"   x="268" y="179">1</text>
  <rect class="off" x="326" y="162" width="96" height="34" rx="7"/><text class="zero-t" x="374" y="179">0</text>
  <rect class="on"  x="432" y="162" width="96" height="34" rx="7"/><text class="cell"   x="480" y="179">1</text>
  <rect class="off" x="538" y="162" width="96" height="34" rx="7"/><text class="zero-t" x="586" y="179">0</text>

  <line class="rule" x1="16" y1="212" x2="664" y2="212"/>

  <!-- ===== Results: res = f(a, b) ===== -->
  <text class="head" x="16" y="234">RESULT</text>

  <!-- Unmasked -->
  <text class="lbl" x="16" y="262">Unmasked</text>
  <text class="sub" x="16" y="277">no mask argument</text>
  <rect class="f" x="220" y="246" width="96" height="34" rx="7"/><text class="cell" x="268" y="263">f(a₀,b₀)</text>
  <rect class="f" x="326" y="246" width="96" height="34" rx="7"/><text class="cell" x="374" y="263">f(a₁,b₁)</text>
  <rect class="f" x="432" y="246" width="96" height="34" rx="7"/><text class="cell" x="480" y="263">f(a₂,b₂)</text>
  <rect class="f" x="538" y="246" width="96" height="34" rx="7"/><text class="cell" x="586" y="263">f(a₃,b₃)</text>

  <!-- Merge-Masked -->
  <text class="lbl" x="16" y="304">Merge-Masked</text>
  <text class="sub" x="16" y="319">M · _mask</text>
  <rect class="f" x="220" y="288" width="96" height="34" rx="7"/><text class="cell" x="268" y="305">f(a₀,b₀)</text>
  <rect class="a" x="326" y="288" width="96" height="34" rx="7"/><text class="cell" x="374" y="305">a₁</text>
  <rect class="f" x="432" y="288" width="96" height="34" rx="7"/><text class="cell" x="480" y="305">f(a₂,b₂)</text>
  <rect class="a" x="538" y="288" width="96" height="34" rx="7"/><text class="cell" x="586" y="305">a₃</text>

  <!-- Zero-Masked -->
  <text class="lbl" x="16" y="346">Zero-Masked</text>
  <text class="sub" x="16" y="361">Z · _maskz</text>
  <rect class="f" x="220" y="330" width="96" height="34" rx="7"/><text class="cell"   x="268" y="347">f(a₀,b₀)</text>
  <rect class="z" x="326" y="330" width="96" height="34" rx="7"/><text class="zero-t" x="374" y="347">0</text>
  <rect class="f" x="432" y="330" width="96" height="34" rx="7"/><text class="cell"   x="480" y="347">f(a₂,b₂)</text>
  <rect class="z" x="538" y="330" width="96" height="34" rx="7"/><text class="zero-t" x="586" y="347">0</text>

  <!-- Source-Masked -->
  <text class="lbl" x="16" y="388">Source-Masked</text>
  <text class="sub" x="16" y="403">S · _masks</text>
  <rect class="f" x="220" y="372" width="96" height="34" rx="7"/><text class="cell" x="268" y="389">f(a₀,b₀)</text>
  <rect class="s" x="326" y="372" width="96" height="34" rx="7"/><text class="cell" x="374" y="389">src₁</text>
  <rect class="f" x="432" y="372" width="96" height="34" rx="7"/><text class="cell" x="480" y="389">f(a₂,b₂)</text>
  <rect class="s" x="538" y="372" width="96" height="34" rx="7"/><text class="cell" x="586" y="389">src₃</text>

  <!-- ===== Legend ===== -->
  <line class="rule" x1="16" y1="430" x2="664" y2="430"/>
  <rect class="f" x="16"  y="448" width="16" height="16" rx="4"/><text class="leg" x="40"  y="456">computed f(a, b)</text>
  <rect class="a" x="166" y="448" width="16" height="16" rx="4"/><text class="leg" x="190" y="456">kept from a</text>
  <rect class="s" x="286" y="448" width="16" height="16" rx="4"/><text class="leg" x="310" y="456">taken from src</text>
  <rect class="z" x="420" y="448" width="16" height="16" rx="4"/><text class="leg" x="444" y="456">zero</text>
  <rect class="band" x="496" y="448" width="16" height="16" rx="4"/><text class="leg" x="520" y="456">inactive lane (m = 0)</text>
</svg>
